# Throwaway pod that mounts the dataset volume read-write so you can copy data in:
#   kubectl apply -f deploy/k8s/data-loader-pod.yaml
#   kubectl -n car-damage wait --for=condition=Ready pod/cardamage-data-loader
#   tar -C data/damage_v1 -ch . | kubectl -n car-damage exec -i cardamage-data-loader -- tar -C /data -x   # -h follows symlinks
#   kubectl -n car-damage exec cardamage-data-loader -- ls /data /data/train | head
#   kubectl -n car-damage delete pod cardamage-data-loader
apiVersion: v1
kind: Pod
metadata:
  name: cardamage-data-loader
  namespace: car-damage
spec:
  restartPolicy: Never
  securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
      volumeMounts: [{name: data, mountPath: /data}]
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: cardamage-dataset}
